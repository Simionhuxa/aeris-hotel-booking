name: aeris-mountain-retreat
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeris
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aeris-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  aeris-postgres:
